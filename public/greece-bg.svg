<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1424"/>
      <stop offset="45%" stop-color="#1f3350"/>
      <stop offset="100%" stop-color="#3a5570"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20374b"/>
      <stop offset="100%" stop-color="#0b1a28"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eef1e6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#eef1e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1.6" opacity="0.5"/>
    <circle cx="230" cy="140" r="1.2" opacity="0.35"/>
    <circle cx="340" cy="60" r="1.4" opacity="0.6"/>
    <circle cx="480" cy="110" r="1.2" opacity="0.4"/>
    <circle cx="60" cy="200" r="1.3" opacity="0.4"/>
    <circle cx="600" cy="70" r="1.5" opacity="0.5"/>
    <circle cx="180" cy="250" r="1.1" opacity="0.3"/>
    <circle cx="700" cy="150" r="1.2" opacity="0.35"/>
    <circle cx="900" cy="60" r="1.3" opacity="0.4"/>
    <circle cx="1000" cy="120" r="1.1" opacity="0.3"/>
  </g>

  <!-- moon glow -->
  <circle cx="1300" cy="150" r="140" fill="url(#moon)"/>
  <circle cx="1300" cy="150" r="46" fill="#eef1e6" opacity="0.5"/>

  <!-- distant hazy island across the bay -->
  <path d="M0,430 C120,405 260,400 380,415 C520,432 640,420 760,405 L760,470 L0,470 Z" fill="#16273c" opacity="0.55"/>

  <!-- sea -->
  <rect x="0" y="470" width="1600" height="430" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.08">
    <path d="M0,540 C 200,530 400,550 600,540 C 800,530 950,545 1100,538"/>
    <path d="M0,610 C 220,600 420,618 640,608 C 860,598 1000,614 1150,606"/>
    <path d="M0,690 C 250,682 460,698 700,690"/>
  </g>

  <!-- small sailboats -->
  <g fill="#e7ebec" opacity="0.55">
    <path d="M180,410 L180,370 L205,410 Z"/>
    <rect x="176" y="410" width="10" height="3"/>
    <path d="M420,395 L420,362 L442,395 Z"/>
    <rect x="416" y="395" width="10" height="3"/>
  </g>

  <!-- cliff / hillside carrying the village -->
  <path d="M700,900 L700,600 C 830,520 930,460 1040,410 C 1150,360 1260,290 1360,220 C 1450,158 1540,118 1600,95 L1600,900 Z" fill="#6d5a49"/>
  <path d="M700,900 L700,650 C 840,590 950,530 1060,470 C 1170,410 1280,340 1380,270 C 1460,212 1540,165 1600,140 L1600,260 C 1520,300 1440,340 1360,400 C 1260,470 1150,540 1040,600 C 930,655 830,700 700,760 Z" fill="#5c4a3b" opacity="0.7"/>

  <!-- cypress trees along the ridge -->
  <g fill="#233b31">
    <path d="M735,585 L745,585 L740,525 Z"/>
    <path d="M905,455 L915,455 L910,400 Z"/>
    <path d="M1225,275 L1235,275 L1230,222 Z"/>
    <path d="M1465,168 L1473,168 L1469,124 Z"/>
  </g>

  <!-- village buildings climbing the hill -->
  <g>
    <!-- cluster 1 -->
    <rect x="710" y="560" width="70" height="60" fill="#dfe4e5"/>
    <rect x="726" y="540" width="20" height="24" fill="#d0dadd"/>
    <rect x="734" y="548" width="6" height="10" fill="#17222c"/>
    <rect x="770" y="580" width="46" height="40" fill="#c9d4d8"/>
    <circle cx="793" cy="575" r="17" fill="#3a5f7d"/>

    <!-- cluster 2 -->
    <rect x="845" y="520" width="80" height="65" fill="#e7ebec"/>
    <rect x="860" y="495" width="24" height="30" fill="#d7dfe2"/>
    <rect x="868" y="503" width="7" height="11" fill="#17222c"/>
    <rect x="900" y="500" width="18" height="20" fill="#3a5f7d"/>
    <rect x="925" y="535" width="42" height="50" fill="#d0dadd"/>

    <!-- cluster 3 (bell tower) -->
    <rect x="960" y="470" width="26" height="90" fill="#eef1f1"/>
    <path d="M960,470 L973,445 L986,470 Z" fill="#2c3e4d"/>
    <rect x="970" y="480" width="6" height="10" fill="#17222c"/>
    <line x1="973" y1="445" x2="973" y2="432" stroke="#eef1f1" stroke-width="2"/>
    <line x1="967" y1="437" x2="979" y2="437" stroke="#eef1f1" stroke-width="2"/>
    <rect x="995" y="500" width="60" height="60" fill="#cfd8dc"/>
    <circle cx="1025" cy="495" r="16" fill="#35566f"/>

    <!-- cluster 4 -->
    <rect x="1055" y="450" width="70" height="70" fill="#e2e6e7"/>
    <rect x="1070" y="428" width="20" height="24" fill="#d7dfe2"/>
    <rect x="1078" y="436" width="6" height="9" fill="#17222c"/>
    <rect x="1120" y="470" width="45" height="50" fill="#d3c0a4"/>
    <circle cx="1142" cy="465" r="15" fill="#3a5f7d"/>

    <!-- cluster 5 -->
    <rect x="1170" y="400" width="75" height="70" fill="#eef1f1"/>
    <rect x="1188" y="378" width="22" height="24" fill="#dbe2e4"/>
    <rect x="1196" y="386" width="7" height="9" fill="#17222c"/>
    <rect x="1235" y="415" width="50" height="55" fill="#cfd8dc"/>
    <circle cx="1260" cy="410" r="17" fill="#3a5f7d"/>

    <!-- cluster 6, higher up -->
    <rect x="1290" y="340" width="65" height="65" fill="#e2e6e7"/>
    <rect x="1305" y="318" width="20" height="24" fill="#d7dfe2"/>
    <rect x="1313" y="326" width="6" height="9" fill="#17222c"/>
    <rect x="1350" y="360" width="40" height="45" fill="#d3c0a4"/>

    <!-- cluster 7, near the top -->
    <rect x="1395" y="285" width="60" height="55" fill="#eef1f1"/>
    <circle cx="1420" cy="280" r="15" fill="#35566f"/>
    <rect x="1415" y="288" width="6" height="9" fill="#17222c"/>
    <rect x="1450" y="305" width="45" height="40" fill="#cfd8dc"/>

    <!-- cluster 8, topmost -->
    <rect x="1495" y="240" width="55" height="50" fill="#e7ebec"/>
    <rect x="1510" y="220" width="18" height="22" fill="#d0dadd"/>
    <rect x="1516" y="227" width="6" height="8" fill="#17222c"/>
  </g>

  <!-- soft bougainvillea accents -->
  <g fill="#9c5265" opacity="0.5">
    <circle cx="796" cy="618" r="3"/>
    <circle cx="804" cy="614" r="2.5"/>
    <circle cx="812" cy="619" r="3"/>
    <circle cx="1148" cy="518" r="3"/>
    <circle cx="1156" cy="514" r="2.5"/>
    <circle cx="1266" cy="468" r="3"/>
    <circle cx="1274" cy="464" r="2.5"/>
  </g>

  <!-- soft vignette to keep the scene calm and let foreground content read clearly -->
  <rect x="0" y="0" width="1600" height="900" fill="#0b1424" opacity="0.12"/>
</svg>
